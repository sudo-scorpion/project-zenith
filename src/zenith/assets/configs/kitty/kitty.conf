# Zenith kitty configuration
#
# Tokyo Night color palette — crafted for extended terminal sessions
# Official reference: https://sw.kovidgoyal.net/kitty/conf/
#
# Useful commands:
#   kitten choose-fonts
#   kitten themes
#
# Personal overrides belong in:
#   ~/.config/kitty/kitty.local.conf
#   ~/.config/kitty/kitty.d/*.conf
# Zenith leaves those alone.

# -----------------------------------------------------------------------------
# Typography
# -----------------------------------------------------------------------------
font_family      JetBrainsMonoNL Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.5
adjust_line_height  108%
adjust_column_width 0
disable_ligatures   never

# JetBrains Mono OpenType features — ss02: alternate a/g, cv16: alternate @
font_features JetBrainsMonoNL-Regular +ss02 +cv16 +ss01
font_features JetBrainsMonoNL-Bold     +ss02 +cv16 +ss01
font_features JetBrainsMonoNL-Italic   +ss02 +cv16 +ss01

# Nerd Font symbol ranges — ensures icon glyphs render even when kitty
# falls back to a different main font.
symbol_map U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0BF,U+E0C0-U+E0C8,U+E0CA,U+E0CC-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B1,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2E0,U+F0001-U+F1AF0 JetBrainsMonoNL Nerd Font

# -----------------------------------------------------------------------------
# Cursor — block shape with animated ghost trail
# cursor_trail requires Kitty 0.36+
# -----------------------------------------------------------------------------
cursor_shape               block
cursor_blink_interval      0.5
cursor_stop_blinking_after 15.0
cursor                     #7aa2f7
cursor_text_color          #1a1b26

# Cursor trail — glowing ghost trail as the cursor moves
cursor_trail                 6
cursor_trail_decay           0.05 0.3
cursor_trail_start_threshold 1

# -----------------------------------------------------------------------------
# Selection and interaction
# -----------------------------------------------------------------------------
shell_integration          enabled
copy_on_select             clipboard
strip_trailing_spaces      never
select_by_word_characters  @-./_~?&=%+#:
selection_foreground       #1a1b26
selection_background       #7aa2f7

# -----------------------------------------------------------------------------
# Scrollback and mouse
# -----------------------------------------------------------------------------
scrollback_lines              50000
scrollback_pager_history_size 256
scrollback_pager              less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier       5.0
touch_scroll_multiplier       1.0
mouse_hide_wait               2.5
pointer_shape_when_grabbed    arrow
default_pointer_shape         beam
detect_urls                   yes
url_prefixes                  file ftp ftps git http https irc ircs kitty mailto mms news sftp ssh

# Click to open URLs
mouse_map left click ungrabbed mouse_handle_click selection link prompt
mouse_map ctrl+left press ungrabbed mouse_selection normal

# Right-click paste from clipboard
mouse_map right press ungrabbed paste_from_clipboard

# -----------------------------------------------------------------------------
# Window — frosted glass effect
# -----------------------------------------------------------------------------
shell                   /usr/bin/zsh

enable_audio_bell       no
visual_bell_duration    0.0
visual_bell_color       #313244
window_alert_on_bell    no
confirm_os_window_close 0
remember_window_size    yes
initial_window_width    120c
initial_window_height   36c

# Frosted glass: background compositor blur + partial transparency
background_opacity      0.87
background_blur         64

dynamic_background_opacity no
window_padding_width    14
single_window_margin_width -1
window_margin_width     0
hide_window_decorations no
resize_in_steps         no
resize_debounce_time    0.08
placement_strategy      center
wayland_titlebar_color  background
wayland_enable_ime      no
linux_display_server    wayland

active_border_color     #7aa2f7
inactive_border_color   #1e2030
bell_border_color       #f9e2af
inactive_text_alpha     0.75

# Zenith manages kitty updates — disable background version checks
update_check_interval   0

# Allow kitten remote control for dynamic features
allow_remote_control    yes
listen_on               unix:/tmp/kitty-zenith

# -----------------------------------------------------------------------------
# Layouts
# -----------------------------------------------------------------------------
enabled_layouts splits,tall,fat,stack,grid,horizontal,vertical

# -----------------------------------------------------------------------------
# Tabs — slant powerline style, Tokyo Night
# -----------------------------------------------------------------------------
tab_bar_edge              top
tab_bar_style             powerline
tab_powerline_style       slanted
tab_bar_align             left
tab_bar_min_tabs          1
tab_bar_background        #11111b
tab_bar_margin_height     2.0 0.0
tab_switch_strategy       previous
active_tab_font_style     bold
inactive_tab_font_style   normal

active_tab_foreground     #1a1b26
active_tab_background     #7aa2f7
inactive_tab_foreground   #565f89
inactive_tab_background   #1e2030

tab_title_max_length      26
tab_title_template        {fmt.fg._565f89}{index}  {bell_symbol}{activity_symbol}{title[:22]}
active_tab_title_template {fmt.bold}{index}{fmt.nobold}  {title[:22]}

# -----------------------------------------------------------------------------
# Base colors — Tokyo Night
# -----------------------------------------------------------------------------
foreground              #cdd6f4
background              #1a1b26
url_color               #74c7ec

mark1_foreground        #1a1b26
mark1_background        #f9e2af
mark2_foreground        #1a1b26
mark2_background        #bb9af7
mark3_foreground        #1a1b26
mark3_background        #9ece6a

# Normal colors
color0  #24283b
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #c0caf5

# Bright colors
color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #cdd6f4

# -----------------------------------------------------------------------------
# Links and clipboard
# -----------------------------------------------------------------------------
open_url_with     default
allow_hyperlinks  yes
clipboard_control write-clipboard write-primary read-clipboard no-append
clipboard_max_size 512

# -----------------------------------------------------------------------------
# Performance — maximize smoothness
# -----------------------------------------------------------------------------
repaint_delay   8
input_delay     2
sync_to_monitor yes

# -----------------------------------------------------------------------------
# Keyboard — tabs, windows, splits, font size, integrations
# -----------------------------------------------------------------------------
kitty_mod            ctrl+shift
clear_all_shortcuts  no

# ── Font size ────────────────────────────────────────────────────────────────
map kitty_mod+equal      change_font_size all +1.0
map kitty_mod+minus      change_font_size all -1.0
map kitty_mod+backspace  change_font_size all 0

# ── Clipboard ────────────────────────────────────────────────────────────────
map kitty_mod+c          copy_to_clipboard
map kitty_mod+v          paste_from_clipboard
map kitty_mod+s          paste_from_selection

# ── Tabs ─────────────────────────────────────────────────────────────────────
map kitty_mod+t          new_tab_with_cwd
map kitty_mod+w          close_tab
map kitty_mod+]          next_tab
map kitty_mod+[          previous_tab
map kitty_mod+.          move_tab_forward
map kitty_mod+,          move_tab_backward

# Jump to tab by number
map kitty_mod+1          goto_tab 1
map kitty_mod+2          goto_tab 2
map kitty_mod+3          goto_tab 3
map kitty_mod+4          goto_tab 4
map kitty_mod+5          goto_tab 5
map kitty_mod+6          goto_tab 6
map kitty_mod+7          goto_tab 7
map kitty_mod+8          goto_tab 8
map kitty_mod+9          goto_tab 9

# ── Windows / splits ────────────────────────────────────────────────────────
map kitty_mod+enter      new_window_with_cwd
map kitty_mod+d          launch --location=hsplit --cwd=current
map kitty_mod+shift+d    launch --location=vsplit --cwd=current
map kitty_mod+h          neighboring_window left
map kitty_mod+l          neighboring_window right
map kitty_mod+k          neighboring_window up
map kitty_mod+j          neighboring_window down
map kitty_mod+r          start_resizing_window
map kitty_mod+z          toggle_layout stack

# Swap windows
map kitty_mod+shift+h    move_window left
map kitty_mod+shift+l    move_window right
map kitty_mod+shift+k    move_window up
map kitty_mod+shift+j    move_window down

# ── Scrollback ───────────────────────────────────────────────────────────────
map kitty_mod+g          show_scrollback
map kitty_mod+/          launch --type=overlay --stdin-source=@screen_scrollback /bin/sh -c 'fzf --no-sort --no-mouse -i --tac --exact 2>/dev/null || grep --color=auto -i ""'

# ── Hints — open URL under cursor ───────────────────────────────────────────
map kitty_mod+p          open_url_with_hints
map kitty_mod+shift+p    kitten hints --type path --program -

# ── Tool integration overlays ───────────────────────────────────────────────
# Yazi file manager (overlay pane — press q to return to shell)
map kitty_mod+e          launch --type=overlay --cwd=current yazi

# Lazygit (overlay pane — press q to return to shell)
map kitty_mod+shift+g    launch --type=overlay --cwd=current lazygit

# btop / htop system monitor
map kitty_mod+shift+m    launch --type=overlay btop || htop || top

# ── Broadcast mode — type in all windows ────────────────────────────────────
map kitty_mod+b          launch --allow-remote-control kitty +kitten broadcast

# ── Reset terminal ──────────────────────────────────────────────────────────
map kitty_mod+delete     clear_terminal reset active

# -----------------------------------------------------------------------------
# Startup session — open in home directory
# -----------------------------------------------------------------------------
startup_session none

# -----------------------------------------------------------------------------
# Theme support
# -----------------------------------------------------------------------------
# `kitten themes` writes ~/.config/kitty/current-theme.conf
globinclude current-theme.conf

# -----------------------------------------------------------------------------
# Personal overrides
# -----------------------------------------------------------------------------
globinclude kitty.local.conf
globinclude kitty.d/*.conf
globinclude kitty.d/**/*.conf
