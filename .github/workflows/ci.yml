name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install .
      - name: Compile
        run: python -m py_compile src/zenith/*.py bin/zen
      - name: Smoke tests
        run: bash tests/smoke/router.sh
      - name: Integration tests
        run: bash tests/integration/lifecycle.sh
      - name: Packaged install tests
        run: bash tests/integration/package_install.sh
